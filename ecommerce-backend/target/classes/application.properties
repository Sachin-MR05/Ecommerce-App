spring.application.name=ecommerce-backend
server.port=8080

# Loads a .env file (KEY=VALUE, one per line) sitting next to pom.xml, if present.
# This is where you put your PostgreSQL connection details - see .env.example
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL connection (values come from the .env file / real env vars) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-create/update tables from the JPA entities (fine for dev; use migrations in real prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# One-time seed data (used only the first time the DB tables are empty)
app.seed.products-file=data/products.json
app.seed.admin-username=admin
app.seed.admin-email=admin@example.com
app.seed.admin-password=${ADMIN_DEFAULT_PASSWORD:admin123}

# JWT auth
jwt.secret=${JWT_SECRET:dev-only-secret-please-change-me-dev-only-secret-please-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Anyone registering as ADMIN must supply this code (prevents random self-signup as admin)
app.security.admin-invite-code=${ADMIN_INVITE_CODE:letmein-admin}

# Razorpay (test mode) - keys come from your .env
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.currency=INR

# Pretty error messages instead of default whitelabel page
server.error.include-message=always

logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.security=INFO
